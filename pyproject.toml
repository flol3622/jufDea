[project]
name = "jufdea"
version = "2026"
description = "Generate personalized classroom name-card PDFs with NiceGUI"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "fpdf2>=2.8,<3",
    "nicegui>=3.12,<4",
    "pymupdf>=1.26,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "ty>=0.0.63,<1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ty.src]
# Pyodide executes this bootstrap as a script with top-level await and provides
# its browser-only imports dynamically.
exclude = ["static/entrypoint.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
main_file = "app.py"
pythonpath = ["."]
testpaths = ["tests"]
